name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Create fresh Flutter project
        run: |
          mkdir -p /tmp/flutter_project
          flutter create --project-name inspection_manager_app /tmp/flutter_project

      - name: Copy application files
        run: |
          cp lib/main.dart /tmp/flutter_project/lib/main.dart
          cp pubspec.yaml /tmp/flutter_project/pubspec.yaml

      - name: Configure Android
        working-directory: /tmp/flutter_project
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts
          sed -i '/compileSdk = 35/a\    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
          sed -i '/minSdk = flutter.minSdkVersion/c\        minSdk = 23' android/app/build.gradle.kts

      - name: Remove default Flutter test
        run: |
          rm -rf /tmp/flutter_project/test

      - name: Get dependencies
        working-directory: /tmp/flutter_project
        run: |
          flutter pub get

      - name: Build APK
        working-directory: /tmp/flutter_project
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inspection_manager_apk
          path: /tmp/flutter_project/build/app/outputs/flutter-apk/app-release.apk
