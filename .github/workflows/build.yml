name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [inspector, supervisor, manager]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Create fresh Flutter project
        run: |
          mkdir -p /tmp/flutter_project
          flutter create --project-name inspection_manager_app /tmp/flutter_project

      - name: Copy application files
        run: |
          cp lib/main.dart /tmp/flutter_project/lib/main.dart
          cp pubspec.yaml /tmp/flutter_project/pubspec.yaml
          cp -r assets /tmp/flutter_project/assets
          cp google-services.json /tmp/flutter_project/android/app/google-services.json

      - name: Configure Android
        working-directory: /tmp/flutter_project
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts
          sed -i '/compileSdk = 35/a\    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
          sed -i '/minSdk = flutter.minSdkVersion/c\        minSdk = 23' android/app/build.gradle.kts
          sed -i 's/namespace = "com.example.inspection_manager_app"/namespace = "com.samaneh.modiribazresi"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com.example.inspection_manager_app"/applicationId = "com.samaneh.modiribazresi"/' android/app/build.gradle.kts

          # جابه‌جایی MainActivity.kt به مسیر پوشه‌ی جدید و اصلاح خط package داخل خودش
          # تا با namespace/applicationId جدید هماهنگ باشد (وگرنه ClassNotFoundException می‌دهد)
          OLD_DIR="android/app/src/main/kotlin/com/example/inspection_manager_app"
          NEW_DIR="android/app/src/main/kotlin/com/samaneh/modiribazresi"
          mkdir -p "$NEW_DIR"
          mv "$OLD_DIR/MainActivity.kt" "$NEW_DIR/MainActivity.kt"
          sed -i 's/package com.example.inspection_manager_app/package com.samaneh.modiribazresi/' "$NEW_DIR/MainActivity.kt"
          rm -rf "android/app/src/main/kotlin/com/example"

          echo "--- MainActivity.kt after move ---"
          cat "$NEW_DIR/MainActivity.kt"

          echo "--- android/settings.gradle.kts before edit ---"
          cat android/settings.gradle.kts
          sed -i '/id("dev.flutter.flutter-plugin-loader")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
          echo "--- android/settings.gradle.kts after edit ---"
          cat android/settings.gradle.kts
          grep -q 'com.google.gms.google-services' android/settings.gradle.kts || (echo "::error::google-services plugin line was NOT added to settings.gradle.kts — sed pattern did not match the file's actual content shown above." && exit 1)

          echo "--- android/app/build.gradle.kts before edit ---"
          cat android/app/build.gradle.kts
          sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
          echo "--- android/app/build.gradle.kts after edit ---"
          cat android/app/build.gradle.kts
          grep -q 'id("com.google.gms.google-services")$' android/app/build.gradle.kts || (echo "::error::google-services plugin line was NOT added to app/build.gradle.kts — sed pattern did not match the file's actual content shown above." && exit 1)
          grep -q 'com.samaneh.modiribazresi' android/app/build.gradle.kts || (echo "::error::applicationId/namespace was NOT updated to com.samaneh.modiribazresi — package will not match google-services.json and Firebase will crash at startup." && exit 1)

      - name: Remove default Flutter test
        run: |
          rm -rf /tmp/flutter_project/test

      - name: Set app display name
        working-directory: /tmp/flutter_project
        run: |
          sed -i 's/android:label="inspection_manager_app"/android:label="سامانه مدیریت بازرسی"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: /tmp/flutter_project
        run: |
          flutter pub get

      - name: Generate launcher icons
        working-directory: /tmp/flutter_project
        run: |
          dart run flutter_launcher_icons

      # نقش (LOCKED_ROLE) در همین مرحله در باینری کامپایل می‌شود؛ هر کدام از سه اجرای
      # ماتریکس یک APK جدا با نقش ثابت و غیرقابل‌تغییر از تنظیمات می‌سازد.
      - name: Build APK (role=${{ matrix.role }})
        working-directory: /tmp/flutter_project
        run: |
          flutter build apk --release --dart-define=LOCKED_ROLE=${{ matrix.role }}

      - name: Copy APK for release
        run: |
          cp /tmp/flutter_project/build/app/outputs/flutter-apk/app-release.apk inspection_manager_app-${{ matrix.role }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "نسخه build-${{ github.run_number }}"
          files: inspection_manager_app-${{ matrix.role }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inspection_manager_apk-${{ matrix.role }}
          path: /tmp/flutter_project/build/app/outputs/flutter-apk/app-release.apk
